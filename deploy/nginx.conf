server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/manifest+json image/svg+xml;

    # iTunes search/previews/artwork + Cloudflare Web Analytics; everything else is same-origin.
    set $csp "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.mzstatic.com; media-src 'self' blob: https://*.apple.com; connect-src 'self' https://itunes.apple.com https://cloudflareinsights.com; font-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'";

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(self), display-capture=(self), geolocation=(), payment=()" always;
    add_header X-Frame-Options DENY always;

    location /assets/ {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(self), display-capture=(self), geolocation=(), payment=()" always;
        add_header X-Frame-Options DENY always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location ~ /\. { deny all; }
}
