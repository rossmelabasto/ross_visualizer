name: Site

# Publishes ros.rossmel.com: the page, the compatibility script and the package repositories of
# the newest release. Only the latest version is served, so no binaries ever live in git.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'CHANGELOG.es.md'
      - 'scripts/check.sh'
      - 'scripts/release/site.mjs'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the repositories of the newest release
        run: |
          mkdir _site
          tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          if [ -n "$tag" ]; then
            gh release download "$tag" --pattern ross-visualizer-repos.tar.gz --output repos.tar.gz
            tar xzf repos.tar.gz -C _site
          fi
      - run: node scripts/release/site.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
