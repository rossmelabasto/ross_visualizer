name: Release

# A tag like v0.1.0 builds, tests and publishes everything. Pushing to a release-test/ branch runs
# the same build, signing (with a throwaway key) and install tests, and publishes nothing.
on:
  push:
    tags: ['v*']
    branches: ['release-test/**']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # The oldest supported base, so the binary runs on every newer glibc.
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the version
        id: version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ $GITHUB_REF == refs/tags/* && $GITHUB_REF_NAME != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match tauri.conf.json version $version"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libgtk-layer-shell-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file
      - run: npm ci
      - run: npm test
      - name: Build the packages
        run: npx tauri build --bundles deb,rpm,appimage
      - name: Collect the packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/deb/*.deb out/
          cp src-tauri/target/release/bundle/rpm/*.rpm out/
          cp src-tauri/target/release/bundle/appimage/*.AppImage out/
          dir="ross-visualizer-$VERSION-x86_64"
          mkdir "$dir"
          cp src-tauri/target/release/ross-visualizer "$dir/"
          cp packaging/ross-visualizer.desktop LICENSE "$dir/"
          cp public/icon-512.png "$dir/ross-visualizer.png"
          tar czf "out/$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: out/
          if-no-files-found: error

  arch:
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: out
      - name: Build the Arch package from the release tarball
        run: |
          pacman -Syu --noconfirm --needed git >/dev/null
          useradd -m builder
          tarball="out/ross-visualizer-$VERSION-x86_64.tar.gz"
          bash scripts/release/pkgbuild.sh "$VERSION" "$tarball" aur
          mkdir build
          cp aur/PKGBUILD "$tarball" build/
          chown -R builder build
          # The source is already here, under the name the PKGBUILD downloads it as.
          su builder -c 'cd build && makepkg --nodeps --noconfirm && makepkg --printsrcinfo > .SRCINFO'
          mkdir -p arch-out
          cp build/*.pkg.tar.zst arch-out/
          cp build/.SRCINFO aur/
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: arch-out/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: aur
          path: aur/
          include-hidden-files: true
          if-no-files-found: error

  repos:
    needs: [build, arch]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages
      - uses: actions/download-artifact@v4
        with:
          name: arch-package
          path: packages
      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils rpm createrepo-c
      - name: Set up the signing key
        env:
          SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            printf '%s' "$SIGNING_KEY" | gpg --batch --import
          else
            # A branch run never touches the real key.
            gpg --batch --passphrase '' --quick-generate-key 'ross packages (test)' rsa4096 sign never
          fi
          fingerprint=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "SIGNING_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"
      - name: Build the signed repositories
        run: bash scripts/release/repos.sh packages repos
      - uses: actions/upload-artifact@v4
        with:
          name: repos
          path: repos/
          if-no-files-found: error

  # Add the repository and install on each clean system, the way the install guide says.
  install-test:
    needs: repos
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: 'cachyos/cachyos:latest', kind: arch }
          - { image: 'archlinux:latest', kind: arch }
          - { image: 'ubuntu:24.04', kind: deb }
          - { image: 'ubuntu:22.04', kind: deb }
          - { image: 'debian:13', kind: deb }
          - { image: 'fedora:latest', kind: rpm }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: repos
          path: repos
      - name: Install on ${{ matrix.image }}
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 -d repos >/dev/null 2>&1 &
          sleep 1
          docker run --rm --network host -v "$PWD:/w:ro" "${{ matrix.image }}" \
            bash /w/scripts/release/install-test.sh "${{ matrix.kind }}" http://127.0.0.1:8080

  appimage-test:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages
      - name: Run the AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth dbus
          chmod +x packages/*.AppImage
          bash scripts/release/smoke.sh "$PWD"/packages/*.AppImage --appimage-extract-and-run

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, arch, repos, install-test, appimage-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages
      - uses: actions/download-artifact@v4
        with:
          name: arch-package
          path: packages
      - uses: actions/download-artifact@v4
        with:
          name: aur
          path: aur
      - uses: actions/download-artifact@v4
        with:
          name: repos
          path: repos
      - name: Create the GitHub release
        run: |
          tar czf ross-visualizer-repos.tar.gz -C repos .
          awk -v v="$VERSION" '$0 ~ "^## \\[?"v"[] ]|^## "v"$" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          # Everything before 1.0 is an alpha: marked as a pre-release.
          gh release create "$GITHUB_REF_NAME" --prerelease --verify-tag \
            --title "ross_visualizer $VERSION (alpha)" --notes-file notes.md \
            packages/* ross-visualizer-repos.tar.gz aur/PKGBUILD aur/.SRCINFO
      - name: Refresh the website
        run: gh workflow run site.yml --ref main
